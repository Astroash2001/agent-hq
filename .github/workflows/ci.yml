name: CI

on:
  push:
    branches: [ main, "wp*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          cd backend && python -m pytest -q

      # The eval suite running here is the whole point of it being real. Replay
      # mode serves recorded exchanges and never calls a provider, so this needs
      # no credential and cannot go red because someone's key expired.
      #
      # The model is named because it has to be: the cassettes were recorded
      # against flash-lite, and replaying them under a different model is
      # refused rather than silently served. Change this line when the suite is
      # re-recorded against something else.
      - name: Run the eval smoke suite
        run: |
          python -m evals.runner --suite smoke --replay --model gemini/gemini-3.5-flash-lite
