<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent HQ — 2D Virtual Office</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-viewport">
        <!-- ================= LEFT: office + dock + command bar ================= -->
        <main class="canvas-panel" role="main" aria-label="Virtual Office Simulation">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="officeCanvas" aria-label="Interactive 2D office workspace"></canvas>
                <div class="canvas-tooltip" id="canvasTooltip" role="tooltip" aria-hidden="true"></div>
            </div>

            <!-- Agent card dock. Populated by hud.js from the agent manifests. -->
            <div class="agent-dock" id="agentDock" role="list" aria-label="Agent roster"></div>

            <div class="bottom-command-bar">
                <form id="promptForm" class="prompt-form" aria-label="Agent command input">
                    <span class="cmd-indicator" aria-hidden="true">&gt;</span>
                    <input type="text" id="promptInput"
                           placeholder="Command Boss Dave or a specialist (e.g. 'Research market trends and write a report')…"
                           autocomplete="off" required aria-label="Command prompt">
                    <button type="submit" class="dispatch-button" id="dispatchBtn">DISPATCH</button>
                    <button type="button" class="emergency-button" id="emergencyStopBtn"
                            title="Emergency stop all agents">HALT</button>
                </form>
            </div>
        </main>

        <!-- ================= RIGHT: amber terminal HUD ================= -->
        <aside class="hud-sidebar" role="complementary" aria-label="Telemetry and agent controls">

            <!-- 1. LIVE TERMINAL -->
            <section class="hud-card terminal-card" aria-label="Live terminal console">
                <div class="terminal-titlebar">
                    <span class="glyph" aria-hidden="true">&gt;_</span>
                    <button class="hud-icon-btn" id="clearTerminalBtn"
                            title="Clear logs" aria-label="Clear terminal logs">&times;</button>
                </div>
                <div class="crt-screen" id="terminalLogs" role="log" aria-live="polite">
                    <div class="terminal-prompt-intro">Live terminal log stream.</div>
                </div>
            </section>

            <!-- 2. TOKEN USAGE -->
            <section class="hud-card token-card" aria-label="Token usage">
                <div class="hud-card-header">
                    <div class="card-title-neon">
                        <span class="header-icon" aria-hidden="true">🗄️</span> TOKEN USAGE
                    </div>
                    <div class="metric" id="tokenUsageValue">0/10000</div>
                </div>
                <!-- 20 segments, filled by hud.js. -->
                <div class="equalizer-container" id="tokenFuelGauge"
                     role="meter" aria-valuemin="0" aria-valuemax="10000" aria-valuenow="0"></div>
            </section>

            <!-- 3. EXECUTION PLAN -- the DAG the planner builds. The backend
                 has always broadcast plan.created and dag.update; nothing drew
                 them until now. Hidden until a plan arrives. -->
            <section class="hud-card plan-card" id="planCard" style="display: none;"
                     aria-label="Execution plan">
                <div class="hud-card-header">
                    <div class="card-title-neon">
                        <span class="header-icon" aria-hidden="true">🗺️</span> EXECUTION PLAN
                    </div>
                    <button class="hud-icon-btn" id="dagExpandBtn"
                            title="Expand graph" aria-label="Expand graph">⛶</button>
                    <div class="metric" id="planSource">—</div>
                </div>
                <!-- The DAG as an actual graph. SVG rather than canvas so the
                     labels stay crisp and each node is a real hoverable node. -->
                <div class="dag-viewport" id="dagViewport">
                    <svg id="dagSvg" role="img" aria-label="Execution plan graph"></svg>
                </div>
                <div class="dag-legend" id="dagLegend"></div>
            </section>

            <!-- 4. COST & TELEMETRY -- what the mission is actually spending,
                 while it spends it. Every figure is per-mission: the agents'
                 own counters are lifetime totals. Hidden until a plan lands. -->
            <section class="hud-card cost-card" id="costCard" style="display: none;"
                     aria-label="Mission cost and telemetry">
                <div class="hud-card-header">
                    <div class="card-title-neon">
                        <span class="header-icon" aria-hidden="true">💰</span> MISSION COST
                    </div>
                    <div class="metric" id="costTotal" data-estimated="false">$0.0000</div>
                </div>

                <div class="cost-figures">
                    <div class="cost-figure">
                        <span class="cost-key">ELAPSED</span>
                        <span class="cost-val" id="costElapsed">0:00</span>
                    </div>
                    <div class="cost-figure">
                        <span class="cost-key">TOKENS</span>
                        <span class="cost-val" id="costTokens">0</span>
                    </div>
                    <div class="cost-figure">
                        <span class="cost-key">STEPS</span>
                        <span class="cost-val" id="costSteps" data-failed="false">0/0</span>
                    </div>
                </div>

                <!-- One bar per step, height by wall-clock. The tall one is
                     where the mission actually went. -->
                <div class="cost-latency" id="costLatency"
                     aria-label="Per-step latency"></div>
                <div class="cost-agents" id="costAgents"></div>
            </section>

            <!-- 5. TRACE REPLAY -- drive the office from a past mission's
                 trace.jsonl instead of the live socket. -->
            <section class="hud-card replay-card" id="replayCard"
                     aria-label="Trace replay">
                <div class="hud-card-header">
                    <div class="card-title-neon">
                        <span class="header-icon" aria-hidden="true">⏮</span> TRACE REPLAY
                    </div>
                    <div class="metric" id="replayClock">—</div>
                </div>

                <div class="replay-row">
                    <select id="replayMission" class="replay-select"
                            aria-label="Mission to replay">
                        <option value="">Loading missions…</option>
                    </select>
                    <button class="hud-icon-btn" id="replayRefreshBtn"
                            title="Refresh mission list" aria-label="Refresh mission list">⟳</button>
                </div>

                <div class="replay-row">
                    <button class="replay-btn" id="replayPlayBtn" disabled>▶ PLAY</button>
                    <select id="replaySpeed" class="replay-select replay-speed"
                            aria-label="Replay speed">
                        <option value="1">1×</option>
                        <option value="2" selected>2×</option>
                        <option value="4">4×</option>
                        <option value="8">8×</option>
                    </select>
                    <button class="replay-btn replay-exit" id="replayExitBtn"
                            style="display:none;">LIVE</button>
                </div>

                <input type="range" id="replayScrub" class="replay-scrub"
                       min="0" max="1000" value="0" step="1" disabled
                       aria-label="Scrub through the trace">
                <div class="replay-status" id="replayStatus">
                    Pick a past mission to replay it through the office.
                </div>
            </section>

            <!-- MISSION OUTPUT -- what the user actually asked for. The goal,
                 the finished report, and every artifact with its real body.
                 Hidden until a mission completes. -->
            <section class="hud-card memo-card" id="executiveMemoCard" style="display: none;"
                     aria-label="Mission output">
                <div class="hud-card-header">
                    <div class="card-title-neon">
                        <span class="header-icon" aria-hidden="true">📜</span> MISSION OUTPUT
                    </div>
                    <button class="hud-icon-btn" id="outExpandBtn"
                            title="Expand output" aria-label="Expand output">&#9974;</button>
                    <button class="hud-icon-btn" id="closeMemoBtn" aria-label="Close output">&times;</button>
                </div>

                <div class="out-goal" id="outGoal"></div>
                <div class="out-banner" id="outBanner" style="display: none;"></div>

                <div class="out-tabs" role="tablist">
                    <button class="out-tab" id="outTabReport" role="tab"
                            data-active="true" aria-selected="true">REPORT</button>
                    <button class="out-tab" id="outTabFiles" role="tab"
                            aria-selected="false">FILES <span id="outFileCount">0</span></button>
                </div>

                <div class="out-pane" id="outPaneReport" role="tabpanel">
                    <div class="memo-content markdown-body" id="memoBodyContent"></div>
                </div>
                <div class="out-pane" id="outPaneFiles" role="tabpanel" style="display: none;">
                    <div class="out-files" id="outFiles"></div>
                </div>
            </section>
        </aside>
    </div>

    <!-- Full-screen graph. The sidebar is narrow; a wide plan needs the room. -->
    <div class="dag-overlay" id="dagOverlay" style="display: none;" role="dialog"
         aria-label="Execution plan graph, expanded">
        <div class="dag-overlay-bar">
            <span class="card-title-neon">🗺️ EXECUTION PLAN</span>
            <button class="hud-icon-btn" id="dagCloseBtn" aria-label="Close graph">&times;</button>
        </div>
        <div class="dag-viewport dag-viewport-full" id="dagViewportFull">
            <svg id="dagSvgFull" role="img" aria-label="Execution plan graph"></svg>
        </div>
    </div>

    <!-- Full-screen output. The card is MOVED in here rather than copied, so
         the open files, the selected tab and the scroll position all survive
         the trip -- a second rendered copy would drift out of step. -->
    <div class="panel-overlay" id="outOverlay" style="display: none;" role="dialog"
         aria-label="Mission output, expanded">
        <div class="panel-overlay-host" id="outOverlayHost"></div>
    </div>

    <script src="js/office_map.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/hud.js"></script>
    <!-- Before app.js: app.js constructs the replay driver on load. -->
    <script src="js/replay.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
